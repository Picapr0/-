<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f14" />
  <title>Text Fix Studio</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=7" />
</head>
<body>
  <div class="bg-glow bg-glow--1" aria-hidden="true"></div>
  <div class="bg-glow bg-glow--2" aria-hidden="true"></div>

  <div class="app" id="app">
    <header class="header">
      <div class="header__badge">F5AI · Telegram</div>
      <h1 class="header__title">Text Fix Studio</h1>
      <p class="header__subtitle">Вставьте текст и выберите тип правки — ИИ вернёт исправленный вариант</p>
    </header>

    <main class="main">
      <label class="input-label" for="user-input">Ваш текст</label>
      <textarea
        id="user-input"
        class="input-field input-field--main"
        rows="5"
        placeholder="Вставьте сюда текст с ошибками или черновик…"
        required
      ></textarea>

      <p class="section-label">Тип правки</p>
      <section class="cards" id="prompt-cards" aria-label="Режимы исправления"></section>

      <section class="result" id="result-panel" hidden>
        <div class="result__head">
          <h2 class="result__title" id="result-title">Исправленный текст</h2>
          <div class="result__actions">
            <button type="button" class="btn btn--ghost" id="again-btn">Ещё</button>
            <button type="button" class="btn btn--ghost" id="copy-btn">Копировать</button>
          </div>
        </div>
        <div class="result__body result__body--text" id="result-body"></div>
      </section>
    </main>

    <footer class="footer">
      <p class="footer__hint" id="status-hint">Вставьте текст и выберите тип правки</p>
    </footer>
  </div>

  <div class="loader" id="loader" hidden aria-live="polite" aria-busy="true">
    <div class="loader__spinner"></div>
    <p class="loader__text">Исправляем текст…</p>
    <p class="loader__hint">Обычно 5–15 секунд</p>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span class="toast__icon" aria-hidden="true">✓</span>
    <span class="toast__text" id="toast-text">Готово</span>
  </div>

  <script src="app.js?v=7" type="module"></script>
</body>
</html>
